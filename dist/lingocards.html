<title>LingoCards</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Charis+SIL&display=swap">
<style>
/* LingoCards styles.
   Look: German index cards (Karteikarten) on a cool desk, yellow Ortstafel-style
   sign plates for score and Premium, a U-Bahn-style route line for batches.
   Layout: one centered column (max 36rem), sticky top bar, bottom tab bar.
   Colors are tokens: light values first, then the dark-mode versions. */
:root {
  --bg: #E6EBF0;
  --surface: #F4F7F9;
  --card: #FFFFFF;
  --ink: #132030;
  --ink-2: #4E5D6D;
  --line: #C8D2DC;
  --accent: #1B4F8A;
  --accent-deep: #0F3560;
  --accent-ink: #FFFFFF;
  --sign: #F5B800;
  --sign-deep: #B98A00;
  --sign-ink: #121212;
  --rule: #DD524D;
  --mark: rgba(245, 184, 0, .42);
  --der: #2A66C9;
  --die: #CC3743;
  --das: #17885A;
  --tab-ink: #FFFFFF;
  --good: #17885A;
  --good-bg: #E1F3E9;
  --bad: #CC3743;
  --bad-deep: #8F1F29;
  --bad-bg: #FBE5E7;
  --warn-bg: #FFF4D2;
  --boss-bg: #142238;
  --boss-ink: #EEF2F7;
  --boss-ink-2: #A9B7C8;
  --boss-line: #33466A;
  --boss-tint: rgba(255, 255, 255, .07);
  --heart: #FF5C6A;
  --overlay: rgba(14, 24, 38, .55);
  --shadow: 0 1px 0 rgba(19, 32, 48, .06), 0 10px 26px -14px rgba(19, 32, 48, .32);
  --f-sign: "Barlow Condensed", "Bahnschrift", "Arial Narrow", sans-serif;
  --f-body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --f-ipa: "Charis SIL", "Gentium Book Plus", "Segoe UI", "Lucida Sans Unicode", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D131A; --surface: #141C26; --card: #1A2430; --ink: #E6ECF2; --ink-2: #9AA9B8; --line: #2B3848;
    --accent: #6AA5F0; --accent-deep: #2F5F9C; --accent-ink: #08121E; --sign: #F5B800; --sign-deep: #9C7400; --sign-ink: #121212;
    --rule: #E8716C; --mark: rgba(245, 184, 0, .32); --der: #7AAAF5; --die: #F2818A; --das: #4FCB8D; --tab-ink: #0D131A;
    --good: #4FCB8D; --good-bg: #11291D; --bad: #F2818A; --bad-deep: #A3434C; --bad-bg: #2F161B; --warn-bg: #2B2410;
    --boss-bg: #0A1019; --boss-ink: #EEF2F7; --boss-ink-2: #9BAAC0; --boss-line: #2A3A57;
    --boss-tint: rgba(255, 255, 255, .06); --heart: #FF6B78; --overlay: rgba(0, 0, 0, .65);
    --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 12px 28px -14px rgba(0, 0, 0, .75);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D131A; --surface: #141C26; --card: #1A2430; --ink: #E6ECF2; --ink-2: #9AA9B8; --line: #2B3848;
  --accent: #6AA5F0; --accent-deep: #2F5F9C; --accent-ink: #08121E; --sign: #F5B800; --sign-deep: #9C7400; --sign-ink: #121212;
  --rule: #E8716C; --mark: rgba(245, 184, 0, .32); --der: #7AAAF5; --die: #F2818A; --das: #4FCB8D; --tab-ink: #0D131A;
  --good: #4FCB8D; --good-bg: #11291D; --bad: #F2818A; --bad-deep: #A3434C; --bad-bg: #2F161B; --warn-bg: #2B2410;
  --boss-bg: #0A1019; --boss-ink: #EEF2F7; --boss-ink-2: #9BAAC0; --boss-line: #2A3A57;
  --boss-tint: rgba(255, 255, 255, .06); --heart: #FF6B78; --overlay: rgba(0, 0, 0, .65);
  --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 12px 28px -14px rgba(0, 0, 0, .75);
  color-scheme: dark;
}
:root[data-theme="light"] { color-scheme: light; }

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 16px; line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button { font: inherit; color: inherit; }
a { color: var(--accent); }
h1, h2, h3 { text-wrap: balance; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--ink-2); }
.small { font-size: .875rem; }
.center { text-align: center; }
svg { flex: none; }

.wrap, .view {
  max-width: 36rem; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 18px;
}
.wrap { padding-block: 20px 64px; }
.view { padding-block: 18px calc(100px + env(safe-area-inset-bottom, 0px)); }
.view.enter { animation: viewIn .3s ease-out; }

/* ---------- top bar + tab bar ---------- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--bg); border-bottom: 1px solid var(--line); }
.topbar-in {
  max-width: 36rem; margin: 0 auto; padding-block: 9px; display: flex; align-items: center; gap: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.brand { border: 0; background: none; padding: 0; cursor: pointer; font-family: var(--f-sign); font-weight: 800; font-size: 1.5rem; line-height: 1; letter-spacing: .01em; text-transform: uppercase; color: var(--ink); }
.brand span { color: var(--accent); }
.tb-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.pro-chip {
  display: inline-flex; align-items: center; gap: 5px; border: 0; border-radius: 8px; padding: 7px 10px;
  font-family: var(--f-sign); font-weight: 800; font-size: .86rem; letter-spacing: .08em; text-transform: uppercase; line-height: 1;
  background: var(--sign); color: var(--sign-ink);
}
.pro-chip svg { width: 15px; height: 15px; }
.pro-chip-up { cursor: pointer; box-shadow: 0 2px 0 var(--sign-deep); }
.pro-chip-up:active { transform: translateY(1px); box-shadow: 0 1px 0 var(--sign-deep); }
.avatar-btn { border: 0; padding: 0; background: none; cursor: pointer; border-radius: 50%; display: grid; }
.avatar { display: inline-grid; place-items: center; border-radius: 50%; color: #FFFFFF; font-family: var(--f-sign); font-weight: 800; letter-spacing: .02em; flex: none; }
.avatar.guest { background: var(--surface); color: var(--ink-2); border: 2px dashed var(--line); }
.avatar.guest svg { width: 55%; height: 55%; }
.plate {
  background: var(--sign); color: var(--sign-ink); border-radius: 8px; padding: 6px 12px;
  box-shadow: inset 0 0 0 2px var(--sign), inset 0 0 0 4px var(--sign-ink);
  font-family: var(--f-sign); text-align: center; line-height: 1;
}
.plate b { display: block; font-weight: 800; font-size: 1.15rem; letter-spacing: .05em; text-transform: uppercase; }
.plate span { display: block; margin-top: 3px; font-size: .72rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
.plate-sm { padding: 4px 8px; border-radius: 6px; box-shadow: inset 0 0 0 1.5px var(--sign), inset 0 0 0 3px var(--sign-ink); }
.plate-sm b { font-size: .82rem; } .plate-sm span { font-size: .6rem; margin-top: 1px; }
@media (max-width: 380px) { .plate-sm { display: none; } }

.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--card); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
  box-shadow: 0 -8px 24px -18px rgba(0, 0, 0, .4);
}
.tabbar-in { max-width: 36rem; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tab-btn {
  position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 9px 4px 10px;
  background: none; border: 0; cursor: pointer; color: var(--ink-2);
  font-family: var(--f-sign); font-weight: 700; font-size: .8rem; letter-spacing: .08em; text-transform: uppercase;
}
.tab-btn svg { width: 24px; height: 24px; transition: transform .15s ease; }
.tab-btn:hover svg { transform: translateY(-1px); }
.tab-btn.on { color: var(--accent); }
.tab-btn.on::before { content: ""; position: absolute; top: -1px; left: 26%; right: 26%; height: 4px; border-radius: 0 0 4px 4px; background: var(--sign); }

/* ---------- buttons ---------- */
.btn {
  appearance: none; border: 2px solid transparent; border-radius: 11px;
  padding: 11px 18px; min-height: 48px;
  font-family: var(--f-sign); font-weight: 700; font-size: 1.05rem; letter-spacing: .06em; text-transform: uppercase;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none;
  cursor: pointer; transition: transform .08s ease, box-shadow .08s ease, background-color .15s ease, border-color .15s ease;
}
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn svg { width: 20px; height: 20px; }
.btn-primary { background: var(--accent); color: var(--accent-ink); box-shadow: 0 3px 0 var(--accent-deep); }
.btn-primary:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--accent-deep); }
.btn-ghost { background: transparent; border-color: var(--line); color: var(--ink); }
.btn-ghost:hover:not(:disabled) { border-color: var(--accent); }
.btn-ghost:active:not(:disabled) { transform: translateY(1px); }
.btn-sign { background: var(--sign); color: var(--sign-ink); box-shadow: inset 0 0 0 2px var(--sign), inset 0 0 0 4px var(--sign-ink), 0 3px 0 var(--sign-deep); }
.btn-sign:active:not(:disabled) { transform: translateY(2px); box-shadow: inset 0 0 0 2px var(--sign), inset 0 0 0 4px var(--sign-ink), 0 1px 0 var(--sign-deep); }
.btn-ghost-dark { background: transparent; border-color: var(--boss-line); color: var(--boss-ink); }
.btn-danger { background: var(--bad); color: var(--card); box-shadow: 0 3px 0 var(--bad-deep); }
.btn-wide { width: 100%; }
.btn-big { min-height: 56px; font-size: 1.2rem; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > .btn { flex: 1 1 140px; }
.link-btn { border: 0; background: none; padding: 0 4px; cursor: pointer; color: var(--accent); font-family: var(--f-body); font-size: .9rem; font-weight: 600; text-transform: none; letter-spacing: 0; text-decoration: underline; text-underline-offset: 3px; vertical-align: middle; }

/* ---------- headings ---------- */
.view-title { margin: 4px 0 0; font-family: var(--f-sign); font-weight: 800; font-size: 2.3rem; line-height: 1; text-transform: uppercase; letter-spacing: .01em; }
.view-title .de { display: block; margin-top: 5px; font-family: var(--f-body); font-style: italic; font-weight: 500; font-size: 1rem; text-transform: none; letter-spacing: 0; color: var(--ink-2); }
.lede-left, .note-line { margin: -6px 0 0; color: var(--ink-2); }
.note-line { color: var(--ink); font-weight: 600; padding: 10px 12px; border-radius: 10px; background: var(--warn-bg); margin: 0; }

/* ---------- learn: greeting + today ---------- */
.hello { display: flex; flex-direction: column; gap: 3px; }
.hello .date { margin: 0; font-family: var(--f-sign); font-weight: 700; font-size: .85rem; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); }
.hello h1 { margin: 0; font-family: var(--f-sign); font-weight: 800; font-size: clamp(2.1rem, 8.5vw, 2.8rem); line-height: .95; text-transform: uppercase; }
.hello h1 span { color: var(--accent); }
.hello p { margin: 4px 0 0; color: var(--ink-2); }
.today { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; background: var(--card); border-radius: 14px; padding: 16px 18px; box-shadow: var(--shadow); }
.ring { width: 112px; height: 112px; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring svg circle { transition: stroke-dasharray .6s ease; }
.ring-c { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; }
.ring-c b { font-family: var(--f-sign); font-weight: 800; font-size: 1.9rem; font-variant-numeric: tabular-nums; }
.ring-c span { margin-top: 3px; font-family: var(--f-sign); font-weight: 600; font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.minis { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; margin: 0; min-width: 0; }
.mini { min-width: 0; }
.mini dt, .stat-grid dt, .rstats dt { font-family: var(--f-sign); font-weight: 700; font-size: .76rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
.mini dd { margin: 1px 0 0; font-family: var(--f-sign); font-weight: 800; font-size: 1.55rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.mini dd small { font-size: .9rem; font-weight: 600; color: var(--ink-2); }
.mini-wide { grid-column: 1 / -1; }
.lvl { display: flex; align-items: center; gap: 10px; }
.bar { flex: 1; display: block; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; transition: width .5s ease; }

/* ---------- index card (Karteikarte) ---------- */
.karte { position: relative; background: var(--card); border-radius: 4px 4px 8px 8px; box-shadow: var(--shadow); padding: 13px 18px 18px; display: flex; flex-direction: column; gap: 12px; }
.k-head {
  display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  font-family: var(--f-sign); font-weight: 600; font-size: .8rem; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2);
  padding-bottom: 8px; border-bottom: 2px solid var(--rule);
}
.tab {
  position: absolute; top: -22px; right: 20px; height: 22px; padding: 3px 12px 0; border-radius: 6px 6px 0 0;
  font-family: var(--f-sign); font-weight: 700; font-size: .8rem; letter-spacing: .1em; text-transform: uppercase;
  color: var(--tab-ink); background: var(--ink-2);
}
.tab-der { background: var(--der); } .tab-die { background: var(--die); } .tab-das { background: var(--das); }
.tab-next { background: var(--accent); }
.tab-pro { background: var(--sign); color: var(--sign-ink); }
.has-tab { margin-top: 22px; }
.next-pro { box-shadow: 0 0 0 2px var(--sign), var(--shadow); }
.k-label { font-family: var(--f-sign); font-weight: 700; font-size: .74rem; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); }
.art { font-weight: 600; }
.art-der { color: var(--der); } .art-die { color: var(--die); } .art-das { color: var(--das); }
.next-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.next-title { margin: 0; font-family: var(--f-sign); font-weight: 800; font-size: 1.9rem; line-height: 1; text-transform: uppercase; letter-spacing: .02em; }
.next-de { margin: 3px 0 0; color: var(--ink-2); font-size: 1.05rem; font-style: italic; }
.next-meta { margin: 0; color: var(--ink-2); }
.next-meta b { color: var(--ink); }
.boss-mini {
  flex: none; width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; font-size: 1.9rem;
  background: radial-gradient(circle at 50% 35%, hsl(var(--h) 75% 62% / .5), hsl(var(--h) 60% 35% / .2) 72%);
  box-shadow: inset 0 0 0 2px var(--sign);
}

.flip { display: grid; perspective: 1400px; padding-top: 22px; cursor: pointer; border-radius: 8px; outline-offset: 4px; -webkit-tap-highlight-color: transparent; }
.flip-inner { display: grid; transform-style: preserve-3d; transition: transform .55s cubic-bezier(.3, .7, .2, 1); }
.flip.is-flipped .flip-inner { transform: rotateY(180deg); }
.face { grid-area: 1 / 1; backface-visibility: hidden; -webkit-backface-visibility: hidden; min-height: 330px; }
.flip .back { transform: rotateY(180deg); }
.k-body { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 4px; padding-block: 6px; }
.k-word { font-weight: 700; font-size: clamp(1.8rem, 7.5vw, 2.9rem); line-height: 1.08; letter-spacing: -.01em; overflow-wrap: break-word; }
.k-pos { color: var(--ink-2); font-size: .95rem; padding-bottom: 14px; }
.k-ipa { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 1.15rem; }
.ipa { font-family: var(--f-ipa); }
.ph { color: var(--ink-2); font-style: italic; }
.k-foot { font-family: var(--f-sign); font-size: .78rem; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); text-align: center; }
.k-tr { font-size: 1.65rem; font-weight: 700; line-height: 1.2; padding-bottom: 12px; }
.k-ex { font-size: 1.2rem; font-weight: 600; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding-bottom: 12px; }
.k-exen { color: var(--ink-2); font-size: 1.05rem; }
mark { background: linear-gradient(transparent 55%, var(--mark) 55%); color: inherit; padding: 0 2px; }
.speak { display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); color: var(--accent); cursor: pointer; flex: none; vertical-align: middle; }
.speak svg { width: 18px; height: 18px; }
.speak:hover { border-color: var(--accent); }
.speak.sm { width: 32px; height: 32px; }
.speak.sm svg { width: 15px; height: 15px; }

/* ---------- premium banner ---------- */
.pro-banner {
  width: 100%; display: flex; align-items: center; gap: 14px; padding: 14px 16px; border: 0; border-radius: 14px; text-align: left; cursor: pointer;
  background: var(--boss-bg); color: var(--boss-ink); box-shadow: var(--shadow); position: relative; overflow: hidden;
}
.pro-banner::after { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 0% 50%, rgba(245, 184, 0, .22), transparent 55%); pointer-events: none; }
.pro-banner .medal { flex: none; width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center; background: var(--sign); color: var(--sign-ink); box-shadow: inset 0 0 0 2px var(--sign), inset 0 0 0 4px var(--sign-ink); }
.pro-banner .medal svg { width: 26px; height: 26px; }
.pb-text { min-width: 0; display: flex; flex-direction: column; }
.pb-text b { font-family: var(--f-sign); font-weight: 800; font-size: 1.2rem; letter-spacing: .04em; text-transform: uppercase; }
.pb-text span { color: var(--boss-ink-2); font-size: .92rem; }
.pro-banner .go { margin-left: auto; flex: none; font-family: var(--f-sign); font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--sign); }
@media (max-width: 420px) { .pro-banner .go { display: none; } }

/* ---------- panels ---------- */
.panel { background: var(--card); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.panel-head h3 { margin: 0; font-family: var(--f-sign); font-weight: 800; font-size: 1.25rem; text-transform: uppercase; letter-spacing: .06em; }
.panel p { margin: 0; }
.panel > .btn { align-self: flex-start; }
.empty { color: var(--ink-2); padding: 8px 0; }
.boxes { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.bx { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
.bx-n { font-family: var(--f-sign); font-weight: 800; font-size: 1.25rem; font-variant-numeric: tabular-nums; }
.bx-bar { width: 100%; height: 64px; border-radius: 6px; background: var(--surface); border: 1.5px solid var(--line); display: flex; align-items: flex-end; overflow: hidden; }
.bx-bar i { display: block; width: 100%; background: var(--accent); transition: height .5s ease; }
.bx:first-child .bx-bar i { background: var(--bad); }
.bx:last-child .bx-bar i { background: var(--good); }
.bx-l { font-family: var(--f-sign); font-weight: 600; font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }

.vocab { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.vocab li { display: grid; grid-template-columns: 1fr auto auto; gap: 0 12px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); }
.vocab li:last-child { border-bottom: 0; }
.v-de { font-weight: 700; grid-column: 1; min-width: 0; overflow-wrap: break-word; }
.v-en { grid-column: 1; color: var(--ink-2); font-size: .9rem; }
.boxdots { grid-column: 2; grid-row: 1 / span 2; display: flex; gap: 3px; }
.boxdots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.boxdots i.on { background: var(--accent); }
.vocab .speak { grid-column: 3; grid-row: 1 / span 2; }

/* route */
.route { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.stn, .route-div { position: relative; }
.stn::before, .route-div::before { content: ""; position: absolute; left: 11px; top: 50%; height: 100%; width: 4px; background: var(--line); }
.route-div::before { top: 0; }
.is-pro::before { background: repeating-linear-gradient(to bottom, var(--sign) 0 7px, transparent 7px 12px); }
.stn.done::before { background: var(--accent); }
.stn:last-child::before { display: none; }
.route-div { padding: 8px 0 8px 40px; }
.route-div span { display: inline-flex; align-items: center; gap: 6px; font-family: var(--f-sign); font-weight: 800; font-size: .8rem; letter-spacing: .12em; text-transform: uppercase; color: var(--sign-ink); background: var(--sign); padding: 4px 9px; border-radius: 6px; }
.route-div svg { width: 14px; height: 14px; }
.stn-btn { display: flex; align-items: center; gap: 14px; width: 100%; padding: 9px 4px 9px 0; background: none; border: 0; text-align: left; cursor: pointer; border-radius: 8px; }
.stn-btn:disabled { cursor: default; }
.dot { position: relative; z-index: 1; flex: none; width: 26px; height: 26px; border-radius: 50%; background: var(--card); border: 4px solid var(--line); display: grid; place-items: center; }
.stn.done .dot { background: var(--accent); border-color: var(--accent); }
.stn.done .dot::after { content: ""; width: 8px; height: 5px; border-left: 2.5px solid var(--accent-ink); border-bottom: 2.5px solid var(--accent-ink); transform: translateY(-1px) rotate(-45deg); }
.stn.open .dot { background: var(--sign); border-color: var(--sign-ink); box-shadow: 0 0 0 4px var(--mark); }
.stn.pro .dot { border-color: var(--sign); }
.stn.locked .stn-main, .stn.future .stn-main { opacity: .55; }
.stn-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.stn-t { font-weight: 600; }
.stn-de { font-size: .85rem; color: var(--ink-2); }
.stn-end { flex: none; font-family: var(--f-sign); font-weight: 700; font-size: .92rem; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); }
.stn.open .stn-end { color: var(--accent); }
.stn.done .stn-end { color: var(--sign); letter-spacing: .12em; }
.stn.done .stn-end .off { color: var(--line); }
.stn-btn:hover:not(:disabled) .stn-t { text-decoration: underline; text-underline-offset: 3px; }
.future-row { display: flex; align-items: center; gap: 14px; padding: 9px 0; }
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); font-family: var(--f-sign); font-weight: 700; font-size: .76rem; letter-spacing: .08em; text-transform: uppercase; }
.badge svg { width: 12px; height: 12px; }
.badge-pro { background: var(--sign); color: var(--sign-ink); border-color: transparent; }

/* ---------- forms ---------- */
.form { display: flex; flex-direction: column; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-family: var(--f-sign); font-weight: 700; font-size: .8rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
.field input, .name-form input {
  font: inherit; font-size: 1.05rem; padding: 12px 14px; border-radius: 10px; border: 2px solid var(--line);
  background: var(--surface); color: var(--ink); width: 100%; min-width: 0;
}
.field input:focus, .name-form input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--mark); }
.form-error { margin: 0; padding: 10px 12px; border-radius: 10px; background: var(--bad-bg); border-left: 4px solid var(--bad); }
.demo-note { padding: 10px 12px; border-radius: 10px; background: var(--warn-bg); border: 1.5px dashed var(--sign-deep); font-size: .9rem; }
.demo-note b { font-family: var(--f-sign); font-weight: 800; letter-spacing: .08em; text-transform: uppercase; margin-right: 8px; }
.or { display: flex; align-items: center; gap: 10px; color: var(--ink-2); font-size: .85rem; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; border-radius: 12px; background: var(--surface); border: 1.5px solid var(--line); }
.seg button {
  border: 0; background: none; padding: 9px 4px; border-radius: 9px; cursor: pointer; min-width: 0;
  font-family: var(--f-sign); font-weight: 700; font-size: .95rem; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-2);
}
.seg button small { display: block; font-family: var(--f-body); font-weight: 500; font-size: .74rem; text-transform: none; letter-spacing: 0; }
.seg button[aria-pressed="true"], .seg button[aria-selected="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 0 var(--line), 0 3px 8px -3px rgba(0, 0, 0, .25); }
.opts-panel { gap: 14px; }
.opt-block { display: flex; flex-direction: column; gap: 8px; }
.opt-label { font-weight: 600; }
.divider { height: 1px; background: var(--line); }
.row-opt { display: flex; align-items: center; justify-content: space-between; gap: 14px; cursor: pointer; }
.row-opt b { display: block; font-weight: 600; }
.row-opt small { display: block; color: var(--ink-2); font-size: .85rem; }
.switch { appearance: none; -webkit-appearance: none; flex: none; width: 50px; height: 30px; margin: 0; border-radius: 999px; background: var(--line); position: relative; cursor: pointer; transition: background-color .2s ease; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--card); box-shadow: 0 1px 3px rgba(0, 0, 0, .35); transition: transform .2s ease; }
.switch:checked { background: var(--accent); }
.switch:checked::after { transform: translateX(20px); }
.switch:disabled { opacity: .5; cursor: not-allowed; }
.confirm { display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 10px; background: var(--bad-bg); }

/* ---------- profile ---------- */
.profile-card { display: flex; align-items: center; gap: 16px; background: var(--card); border-radius: 14px; padding: 18px; box-shadow: var(--shadow); }
.pc-main { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px; }
.pc-main h2 { margin: 0; font-family: var(--f-sign); font-weight: 800; font-size: 1.8rem; line-height: 1.05; text-transform: uppercase; overflow-wrap: anywhere; }
.pc-main > p { margin: 0; color: var(--ink-2); overflow-wrap: anywhere; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.name-form { display: flex; gap: 8px; flex-wrap: wrap; }
.name-form input { flex: 1 1 160px; }
.name-form .btn { min-height: 44px; padding-block: 8px; }
.stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 0; }
.stat-grid div { background: var(--card); border-radius: 12px; padding: 12px 12px 10px; box-shadow: var(--shadow); min-width: 0; }
.stat-grid dd { margin: 2px 0 0; font-family: var(--f-sign); font-weight: 800; font-size: 1.5rem; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ---------- premium ---------- */
.back-btn { align-self: flex-start; display: inline-flex; align-items: center; gap: 4px; border: 0; background: none; padding: 4px 0; cursor: pointer; color: var(--ink-2); font-family: var(--f-sign); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.back-btn svg { width: 20px; height: 20px; }
.pro-hero { position: relative; overflow: hidden; background: var(--boss-bg); color: var(--boss-ink); border-radius: 18px; padding: 28px 20px 24px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; box-shadow: var(--shadow); }
.pro-hero::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 50% 0%, rgba(245, 184, 0, .3), transparent 62%); pointer-events: none; }
.crown { position: relative; width: 76px; height: 76px; border-radius: 22px; display: grid; place-items: center; background: var(--sign); color: var(--sign-ink); box-shadow: inset 0 0 0 3px var(--sign), inset 0 0 0 5px var(--sign-ink), 0 10px 30px -8px rgba(245, 184, 0, .6); animation: bob 3s ease-in-out infinite; }
.crown svg { width: 42px; height: 42px; }
.pro-hero h1 { position: relative; margin: 4px 0 0; font-family: var(--f-sign); font-weight: 800; font-size: 2.3rem; line-height: 1; text-transform: uppercase; }
.pro-hero p { position: relative; margin: 0; color: var(--boss-ink-2); max-width: 32ch; }
.plans { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding-top: 8px; }
@media (max-width: 400px) { .plans { grid-template-columns: 1fr; } }
.plan {
  position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; text-align: left;
  padding: 16px; border-radius: 14px; border: 2px solid var(--line); background: var(--card); cursor: pointer; box-shadow: var(--shadow);
  transition: border-color .15s ease, box-shadow .15s ease, transform .1s ease;
}
.plan:hover { border-color: var(--accent); }
.plan[aria-checked="true"] { border-color: var(--accent); box-shadow: 0 0 0 3px var(--mark), var(--shadow); }
.plan .radio { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); margin-bottom: 6px; }
.plan[aria-checked="true"] .radio { border-color: var(--accent); background: var(--accent); box-shadow: inset 0 0 0 4px var(--card); }
.p-name { font-family: var(--f-sign); font-weight: 800; font-size: 1.1rem; letter-spacing: .06em; text-transform: uppercase; }
.p-price { font-family: var(--f-sign); font-weight: 800; font-size: 2.1rem; line-height: 1; font-variant-numeric: tabular-nums; }
.p-price small { font-size: .95rem; font-weight: 600; color: var(--ink-2); }
.p-note { color: var(--ink-2); font-size: .88rem; }
.p-badge { position: absolute; top: -11px; right: 12px; padding: 3px 9px; border-radius: 6px; background: var(--sign); color: var(--sign-ink); font-family: var(--f-sign); font-weight: 800; font-size: .74rem; letter-spacing: .1em; text-transform: uppercase; }
.table-wrap { overflow-x: auto; }
.compare { width: 100%; border-collapse: collapse; font-size: .95rem; }
.compare th, .compare td { padding: 10px 8px; border-bottom: 1px solid var(--line); text-align: center; }
.compare tr:last-child th, .compare tr:last-child td { border-bottom: 0; }
.compare th[scope="row"] { text-align: left; font-weight: 500; }
.compare thead th { font-family: var(--f-sign); font-weight: 800; font-size: .82rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
.compare td { font-family: var(--f-sign); font-weight: 700; white-space: nowrap; }
.yes, .no { display: inline-grid; place-items: center; }
.yes svg, .no svg { width: 20px; height: 20px; }
.yes { color: var(--good); } .no { color: var(--ink-2); }

/* ---------- modal ---------- */
.modal-back {
  position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; background: var(--overlay); animation: fadeIn .2s ease-out;
  padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.modal { width: 100%; max-width: 26rem; background: var(--card); border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 24px 60px -20px rgba(0, 0, 0, .6); animation: rise .25s ease-out; }
.modal h2 { margin: 0; font-family: var(--f-sign); font-weight: 800; font-size: 1.7rem; text-transform: uppercase; }
.modal p { margin: 0; }
.sum { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; background: var(--surface); border: 1.5px solid var(--line); }
.sum > span { display: flex; flex-direction: column; }
.sum-price { font-family: var(--f-sign); font-weight: 800; font-size: 1.3rem; white-space: nowrap; }
.spinner { width: 42px; height: 42px; margin: 10px auto; border-radius: 50%; border: 4px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; }

/* ---------- session ---------- */
.sbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; gap: 10px; padding-block: 10px; margin-top: -10px; background: var(--bg); }
.x { flex: none; height: 40px; min-width: 40px; padding: 0 10px; border-radius: 10px; border: 2px solid var(--line); background: var(--card); cursor: pointer; font-family: var(--f-sign); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.x.armed { border-color: var(--bad); color: var(--bad); }
.prog { flex: 1; position: relative; height: 12px; border-radius: 999px; background: var(--line); overflow: hidden; min-width: 0; }
.prog i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 999px; transition: width .4s ease; }
.prog.with-boss::after { content: ""; position: absolute; left: 80%; top: 0; bottom: 0; width: 3px; background: var(--bg); }
.chip { flex: none; font-family: var(--f-sign); font-weight: 700; font-size: .98rem; padding: 7px 10px; border-radius: 8px; background: var(--card); font-variant-numeric: tabular-nums; line-height: 1; }
.chip-xp { background: var(--sign); color: var(--sign-ink); }
.stage { display: flex; flex-direction: column; gap: 16px; }
.phase-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-family: var(--f-sign); font-size: .86rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.phase-head .eyebrow { font-weight: 800; color: var(--ink); }
.deal-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.deal-actions .btn { flex: 1 1 150px; }
.pips { display: flex; justify-content: center; gap: 6px; }
.pips span { width: 8px; height: 8px; border-radius: 50%; background: var(--line); transition: background-color .2s ease; }
.pips span.on { background: var(--accent); }

/* quiz */
.qcard { background: var(--card); border-radius: 14px; box-shadow: var(--shadow); padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.qtype { font-family: var(--f-sign); font-weight: 800; font-size: .82rem; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
.qprompt { margin: 0; font-size: 1.35rem; font-weight: 600; line-height: 1.35; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.qprompt-de { font-size: 1.5rem; display: block; }
.qprompt .de { font-weight: 700; color: var(--accent); }
.qsub { margin: -6px 0 0; color: var(--ink-2); }
.blank { display: inline-block; min-width: 4.5em; border-bottom: 3px solid var(--accent); line-height: 1.1; text-align: center; }
.blank.filled { color: var(--good); border-bottom-color: var(--good); min-width: 0; padding-inline: 4px; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opts-3 { grid-template-columns: repeat(3, 1fr); }
@media (max-width: 440px) { .opts:not(.opts-3) { grid-template-columns: 1fr; } }
.opt {
  display: flex; align-items: center; gap: 12px; text-align: left; padding: 13px 14px; min-height: 56px; min-width: 0;
  border-radius: 12px; border: 2px solid var(--line); background: var(--surface); cursor: pointer; font-size: 1.06rem; font-weight: 500;
  box-shadow: 0 3px 0 var(--line); transition: transform .08s ease, box-shadow .08s ease, border-color .15s ease;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.opt:disabled { cursor: default; }
.opt .key { flex: none; width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; font-family: var(--f-sign); font-weight: 700; font-size: .85rem; background: var(--bg); color: var(--ink-2); }
.opt-t { min-width: 0; overflow-wrap: break-word; }
.opts-3 .opt { justify-content: center; font-size: 1.35rem; font-weight: 700; }
.opt.is-wrong { border-color: var(--bad); background: var(--bad-bg); color: var(--ink-2); box-shadow: none; animation: nudge .35s ease; }
.opt.is-wrong .opt-t { text-decoration: line-through; }
.opt.is-right { border-color: var(--good); background: var(--good-bg); box-shadow: 0 3px 0 var(--good); animation: pop .3s ease; }
.listen-btn { align-self: flex-start; }
.typeform { display: flex; flex-direction: column; gap: 10px; }
#ans { font: inherit; font-size: 1.3rem; padding: 12px 14px; border-radius: 10px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); width: 100%; }
#ans:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--mark); }
.type-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.type-row .btn { margin-left: auto; }
.uml { width: 44px; height: 44px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--card); font-size: 1.15rem; font-weight: 600; cursor: pointer; }
.uml:hover { border-color: var(--accent); }

.fb { border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; border: 2px solid; animation: rise .25s ease-out; }
.fb p { margin: 0; }
.fb-good { background: var(--good-bg); border-color: var(--good); }
.fb-hint { background: var(--warn-bg); border-color: var(--sign); }
.fb-bad { background: var(--bad-bg); border-color: var(--bad); }
.fb-title { font-family: var(--f-sign); font-weight: 800; font-size: 1.55rem; line-height: 1.1; text-transform: uppercase; letter-spacing: .03em; display: flex; align-items: baseline; gap: 4px 10px; flex-wrap: wrap; }
.fb-sub { font-family: var(--f-body); font-weight: 500; font-size: .95rem; text-transform: none; letter-spacing: 0; color: var(--ink-2); }
.gain { margin-left: auto; background: var(--sign); color: var(--sign-ink); padding: 3px 10px; border-radius: 999px; font-size: 1rem; letter-spacing: .04em; animation: pop .35s ease; }
.fb-answer { font-size: 1.25rem; font-weight: 700; }
.fb-card { color: var(--ink-2); }
.fb .btn { align-self: stretch; }

/* boss */
.arena { background: var(--boss-bg); color: var(--boss-ink); border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 16px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
.arena::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 15% 0%, rgba(255, 92, 106, .16), transparent 50%); pointer-events: none; }
.arena > * { position: relative; }
.boss-top { display: flex; align-items: center; gap: 14px; }
.boss-face {
  flex: none; width: 84px; height: 84px; display: grid; place-items: center; font-size: 3.3rem; line-height: 1; border-radius: 50%;
  background: radial-gradient(circle at 50% 35%, hsl(var(--h) 75% 62% / .6), hsl(var(--h) 60% 30% / .25) 72%);
  box-shadow: inset 0 0 0 3px var(--sign), 0 0 28px hsl(var(--h) 80% 55% / .35);
  animation: bob 2.6s ease-in-out infinite;
}
.boss-face.hit { animation: shake .5s ease; }
.boss-id { min-width: 0; }
.boss-eyebrow { font-family: var(--f-sign); font-weight: 700; font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; color: var(--sign); }
.boss-name { margin: 2px 0 0; font-family: var(--f-sign); font-weight: 800; font-size: 1.8rem; line-height: 1; text-transform: uppercase; letter-spacing: .02em; }
.boss-gloss { margin: 4px 0 0; color: var(--boss-ink-2); }
.boss-meters { display: flex; flex-direction: column; gap: 6px; }
.hp { height: 14px; border-radius: 999px; background: var(--boss-tint); overflow: hidden; box-shadow: inset 0 0 0 1px var(--boss-line); }
.hp i { display: block; height: 100%; background: var(--heart); border-radius: 999px; transition: width .5s ease; }
.meter-row { display: flex; justify-content: space-between; align-items: center; font-family: var(--f-sign); font-weight: 700; letter-spacing: .08em; color: var(--boss-ink-2); }
.hearts { display: flex; gap: 3px; font-size: 1.35rem; color: var(--heart); letter-spacing: 0; }
.heart.lost { color: var(--boss-line); }
.scenario { margin: 0; font-size: 1.1rem; line-height: 1.5; }
.rules { margin: 0; padding-left: 1.2em; color: var(--boss-ink-2); display: flex; flex-direction: column; gap: 4px; }
.round { display: flex; flex-direction: column; gap: 4px; }
.build-prompt { margin: 0; font-size: 1.15rem; }
.slots { min-height: 66px; border: 2px dashed var(--boss-line); border-radius: 12px; padding: 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.slot-ph { color: var(--boss-ink-2); font-size: .95rem; padding-left: 4px; }
.pool { display: flex; flex-wrap: wrap; gap: 8px; }
.tile { padding: 10px 14px; border-radius: 9px; border: 0; background: var(--card); color: var(--ink); font-size: 1.1rem; font-weight: 600; cursor: pointer; box-shadow: 0 3px 0 var(--line); transition: transform .08s ease; }
.tile:active:not(:disabled) { transform: translateY(2px); }
.tile:disabled { cursor: default; }
.tile.used { opacity: .18; box-shadow: none; }
.bmsg { border-radius: 10px; padding: 12px 14px; background: var(--boss-tint); border-left: 4px solid var(--sign); }
.bmsg b { font-family: var(--f-sign); font-weight: 800; font-size: 1.2rem; letter-spacing: .04em; text-transform: uppercase; margin-right: 6px; }
.bmsg-miss { border-left-color: var(--heart); }
.de-line { display: block; margin-top: 4px; font-size: 1.1rem; font-weight: 600; }

/* results */
.results { display: flex; flex-direction: column; gap: 16px; text-align: center; }
.stamp-wrap { display: grid; place-items: center; padding-block: 22px 6px; }
.stamp {
  font-family: var(--f-sign); font-weight: 800; font-size: 2.6rem; letter-spacing: .16em; text-transform: uppercase;
  color: var(--die); border: 4px solid currentColor; border-radius: 10px; padding: 6px 18px 6px 26px;
  box-shadow: inset 0 0 0 3px var(--bg), inset 0 0 0 5px currentColor;
  transform: rotate(-7deg); opacity: .92; animation: stamp .5s cubic-bezier(.2, 1.3, .4, 1) both;
}
.modal .stamp { box-shadow: inset 0 0 0 3px var(--card), inset 0 0 0 5px currentColor; }
.stamp-pro { color: var(--accent); }
.results h2 { margin: 0; font-family: var(--f-sign); font-weight: 800; font-size: 2rem; text-transform: uppercase; letter-spacing: .03em; }
.lede { margin: 0; color: var(--ink-2); font-size: 1.05rem; }
.stars { font-size: 2.4rem; letter-spacing: .18em; color: var(--sign); line-height: 1; }
.stars .off { color: var(--line); }
.rstats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 0; }
.rstats div { background: var(--card); border-radius: 12px; padding: 12px 8px; box-shadow: var(--shadow); }
.rstats dd { margin: 2px 0 0; font-family: var(--f-sign); font-weight: 800; font-size: 1.7rem; font-variant-numeric: tabular-nums; }
.wlist { list-style: none; margin: 0; padding: 4px 16px; background: var(--card); border-radius: 14px; box-shadow: var(--shadow); text-align: left; }
.wlist li { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.wlist li:last-child { border-bottom: 0; }
.wlist li span:first-child { font-weight: 700; }
.wlist li span:last-child { color: var(--ink-2); text-align: right; }

.foot { display: flex; flex-direction: column; gap: 4px; color: var(--ink-2); font-size: .85rem; text-align: center; }
.foot p { margin: 0; }

.toast {
  position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 40;
  max-width: calc(100% - 32px); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px;
  font-weight: 600; text-align: center; box-shadow: var(--shadow);
}
.toast.show { animation: toastIn .3s ease-out; }

@keyframes viewIn { from { transform: translateY(8px); } to { transform: none; } }
@keyframes rise { from { transform: translateY(8px); } to { transform: none; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes toastIn { from { transform: translate(-50%, 10px); } to { transform: translate(-50%, 0); } }
@keyframes pop { 0% { transform: scale(1); } 45% { transform: scale(1.05); } 100% { transform: scale(1); } }
@keyframes nudge { 0%, 100% { transform: none; } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes shake { 0%, 100% { transform: none; } 20% { transform: translateX(-8px) rotate(-6deg); } 40% { transform: translateX(7px) rotate(5deg); } 60% { transform: translateX(-5px) rotate(-3deg); } 80% { transform: translateX(3px); } }
@keyframes stamp { from { transform: rotate(-7deg) scale(1.9); opacity: 0; } to { transform: rotate(-7deg) scale(1); opacity: .92; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
@media (max-width: 400px) {
  .today { grid-template-columns: 1fr; justify-items: center; }
  .minis { width: 100%; }
  .stat-grid { gap: 8px; }
  .stat-grid div { padding-inline: 10px; }
  .stat-grid dd { font-size: 1.25rem; }
  .chip { padding-inline: 8px; }
  .profile-card { flex-direction: column; text-align: center; }
  .profile-card .chips { justify-content: center; }
}

<script>
/* LingoCards accounts and payments.
   DEMO VERSION: everything is stored in this browser's localStorage.
   - Passwords are NOT checked or saved. Never use this for real accounts.
   - Checkout never charges anything.
   To go live, keep the same function names and swap the insides:
   auth.*    -> Supabase Auth (supabase.auth.signUp / signInWithPassword / signOut)
   billing.* -> Stripe Checkout or Payment Links, with a server webhook that marks
                the user as Premium in your database. */
(function () {
  "use strict";
  const CFG = window.LINGO_CONFIG;
  const ACCOUNTS = "lingocards:accounts:v1";
  const CURRENT = "lingocards:current-user:v1";
  const EMAIL = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  const read = k => { try { const s = localStorage.getItem(k); return s ? JSON.parse(s) : null; } catch (e) { return null; } };
  const write = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const fail = msg => { throw new Error(msg); };
  const accounts = () => read(ACCOUNTS) || {};
  const newId = () => "u_" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
  function saveUser(u) { const a = accounts(); a[u.email] = u; write(ACCOUNTS, a); return u; }

  const auth = {
    mode: CFG.mode,

    current() {
      const id = read(CURRENT);
      if (!id) return null;
      return Object.values(accounts()).find(u => u.id === id) || null;
    },

    async signUp({ name, email, password }) {
      await wait(400);
      name = (name || "").trim();
      email = (email || "").trim().toLowerCase();
      if (!name) fail("Enter your name.");
      if (!EMAIL.test(email)) fail("Enter a valid email address.");
      if ((password || "").length < 8) fail("Use a password with at least 8 characters.");
      if (accounts()[email]) fail("An account with this email already exists. Log in instead.");
      const u = { id: newId(), name, email, createdAt: Date.now(), plan: null };
      saveUser(u);
      write(CURRENT, u.id);
      return u;
    },

    async logIn({ email, password }) {
      await wait(400);
      email = (email || "").trim().toLowerCase();
      if (!EMAIL.test(email)) fail("Enter a valid email address.");
      if (!password) fail("Enter your password.");
      const u = accounts()[email];
      if (!u) fail("No account uses this email yet. Create one instead.");
      write(CURRENT, u.id);
      return u;
    },

    async logOut() {
      try { localStorage.removeItem(CURRENT); } catch (e) {}
    },

    async updateName(name) {
      name = (name || "").trim();
      if (!name) fail("Enter your name.");
      const u = auth.current();
      if (!u) fail("Log in first.");
      u.name = name;
      return saveUser(u);
    }
  };

  const billing = {
    mode: CFG.mode,

    isPremium(u) {
      if (!u || !u.plan) return false;
      return u.plan.id === "lifetime" || (u.plan.renewsAt || 0) > Date.now();
    },

    // Live version: return { redirect: "<Stripe checkout URL>" } and the app follows it.
    async startCheckout(planId) {
      if (!CFG.plans.some(p => p.id === planId)) fail("Pick a plan first.");
      return { demo: true };
    },

    async completeDemoPurchase(planId) {
      await wait(1300);
      const u = auth.current();
      if (!u) fail("Log in first.");
      const now = Date.now();
      u.plan = planId === "lifetime"
        ? { id: "lifetime", since: now }
        : { id: "monthly", since: now, renewsAt: now + 30 * 864e5, cancelled: false };
      return saveUser(u);
    },

    // Monthly plans stay active until the paid period ends.
    async cancel() {
      await wait(300);
      const u = auth.current();
      if (u && u.plan && u.plan.id === "monthly") { u.plan.cancelled = true; saveUser(u); }
      return u;
    },

    async resume() {
      const u = auth.current();
      if (u && u.plan && u.plan.id === "monthly") { u.plan.cancelled = false; saveUser(u); }
      return u;
    }
  };

  window.LingoServices = { auth, billing };
})();
</script>

/* ---------- question building ---------- */
function typesFor(w) {
  const t = ["mcDE", "mcEN", "fill"];
  if (PR.typing) t.push("type");
  if (w.p === "noun") t.push("article");
  if (deVoice) t.push("listen");
  return t;
}
function assignTypes(ids) {
  const used = [];
  return ids.map(id => {
    const all = typesFor(W[id]);
    let pool = all.filter(t => !used.includes(t));
    if (!pool.length) pool = all;
    const t = shuffle(pool)[0]; used.push(t); return t;
  });
}
function otherType(q) { const all = typesFor(W[q.id]).filter(t => t !== q.type); return shuffle(all)[0] || "mcDE"; }
function caseLike(v, ref, x) {
  if (!v || x.p === "noun") return v;
  const up = ref[0] !== ref[0].toLowerCase();
  return (up ? v[0].toUpperCase() : v[0].toLowerCase()) + v.slice(1);
}
function pickDistractors(w, fn, n, samePos) {
  const out = [], seen = new Set([norm(fn(w))]);
  const pools = [
    W.filter(x => x.b === w.b && x.id !== w.id && (!samePos || x.p === w.p)),
    W.filter(x => x.id !== w.id && (!samePos || x.p === w.p)),
    W.filter(x => x.id !== w.id)
  ];

    const v = fn(x), k = norm(v);
    if (!seen.has(k)) { seen.add(k); out.push(v); if (out.length === n) return out; }
  }

}

  if (type === "mcDE") { q.answer = w.en; q.options = shuffle([w.en].concat(pickDistractors(w, x => x.en, 3, false))); }
  else if (type === "mcEN" || type === "listen") { q.answer = full(w); q.options = shuffle([full(w)].concat(pickDistractors(w, full, 3, true))); }
  else if (type === "fill") { q.answer = w.f; q.options = shuffle([w.f].concat(pickDistractors(w, x => caseLike(x.f, w.f, x), 3, true))); }

        queue: [], qi: 0, fb: null, done: 0, total: ids.length, first: 0, xp0: P.xp, runBest: 0, boss: null, result: null };

/* ---------- boss ---------- */

  } else {

    B.state = B.hearts <= 0 ? "lost" : "miss";
    sfx.bad();
  }
  save(); render();
}
function finish() {
  const acc = S.total ? S.first / S.total : 0;
  const stars = acc >= 0.9 ? 3 : acc >= 0.6 ? 2 : 1;
  if (S.mode === "batch") {
    const k = "b" + S.bi, prev = P.batches[k];
    P.batches[k] = { done: true, stars: Math.max(stars, (prev && prev.stars) || 0) };
  }
  S.result = { stars, acc, gained: P.xp - S.xp0 };
  S.phase = "results"; save(); render(); toTop();
}
function goHome() { S = null; ui.quitArmed = false; go("learn"); }
function quit() {
  if (!S || S.phase === "results" || ui.quitArmed) return goHome();
  ui.quitArmed = true;
  const b = document.querySelector(".x");
  if (b) { b.textContent = "Leave?"; b.classList.add("armed"); b.setAttribute("aria-label", "Tap again to leave"); }
  clearTimeout(quitT);
  quitT = setTimeout(() => {
    ui.quitArmed = false;
    const x = document.querySelector(".x");
    if (x) { x.textContent = "✕"; x.classList.remove("armed"); x.setAttribute("aria-label", "Leave"); }
  }, 3000);
}

/* ---------- render ---------- */
function render() {
  const app = document.getElementById("app");
  const r = route();
  let html;
  try {
    if (r === "play" && S) html = `<div class="wrap">${sbarHTML()}<main class="stage">${stageHTML()}</main></div>`;
    else {
      const v = r === "play" ? "learn" : r;
      const body = v === "review" ? reviewHTML() : v === "profile" ? (user ? profileHTML() : authHTML()) : v === "options" ? optionsHTML() : v === "premium" ? premiumHTML() : learnHTML();
      html = topbarHTML() + `<main class="view ${lastView !== v ? "enter" : ""}" id="main">${body}</main>` + tabbarHTML(v === "premium" ? "" : v);
      lastView = v;
    }
  } catch (err) {
    console.error(err); S = null; lastView = "learn";
    html = topbarHTML() + `<main class="view">${learnHTML()}</main>` + tabbarHTML("learn");
  }
  if (r === "play" && S) lastView = "play";
  app.innerHTML = html + (ui.modal ? modalHTML() : "");
  const af = app.querySelector(ui.modal ? ".modal [data-autofocus]:not([disabled])" : "[data-autofocus]:not([disabled])");
  if (af) { try { af.focus({ preventScroll: true }); } catch (e) {} }
  if (r === "play" && S && S.phase === "quiz") {
    const q = S.queue[S.qi];
    if (q && q.type === "listen" && !q.played) { q.played = true; setTimeout(() => speak(full(W[q.id])), 200); }
  }
  if (S && S.fb && (S.fb.kind === "good" || S.fb.kind === "reveal")) {
    const fbEl = app.querySelector(".fb");
    if (fbEl && fbEl.scrollIntoView) { try { fbEl.scrollIntoView({ block: "nearest", behavior: "smooth" }); } catch (e) {} }
  }
}

/* ---------- account + payment actions ---------- */
async function onAuth(form) {
  if (ui.busy) return;
  const fd = new FormData(form);
  const name = String(fd.get("name") || ""), email = String(fd.get("email") || ""), password = String(fd.get("password") || "");
  ui.authDraft = { name, email }; ui.authError = ""; ui.busy = true; render();
  try {
    const u = ui.authMode === "signup" ? await SVC.auth.signUp({ name, email, password }) : await SVC.auth.logIn({ email, password });
    const wasGuest = !user;
    switchUser(u, wasGuest);
    ui.busy = false; ui.authDraft = {}; ui.authNote = "";
    toast(ui.authMode === "signup" ? "Willkommen, " + u.name + "! Your account is ready." : "Willkommen zurück, " + u.name + "!");
    const after = ui.after; ui.after = null;
    go(after || "learn");
  } catch (e) {
    ui.busy = false; ui.authError = e.message || "Something went wrong. Try again."; render();
    const f = document.getElementById(ui.authMode === "signup" && !name.trim() ? "f-name" : "f-email");
    if (f) f.focus();
  }
}
async function onRename(form) {
  try { user = await SVC.auth.updateName(new FormData(form).get("name")); ui.editName = false; ui.nameError = ""; toast("Name saved."); }
  catch (e) { ui.nameError = e.message; }
  render();
}
async function checkout() {
  if (!user) { ui.after = "premium"; ui.authMode = "signup"; ui.authNote = "Create a free account first, then pick your plan."; go("profile"); return; }
  try {
    const res = await SVC.billing.startCheckout(ui.plan);
    if (res && res.redirect) { location.href = res.redirect; return; }
    ui.modal = { plan: ui.plan, state: "confirm" }; render();
  } catch (e) { toast(e.message); }
}
async function pay() {
  ui.modal.state = "processing"; render();
  try { user = await SVC.billing.completeDemoPurchase(ui.modal.plan); ui.modal.state = "done"; sfx.win(); }
  catch (e) { ui.modal = null; toast(e.message); }
  render();
}

/* ---------- events ---------- */
function insertChar(c) {
  const inp = document.getElementById("ans");
  if (!inp || inp.disabled) return;
  const s = inp.selectionStart == null ? inp.value.length : inp.selectionStart;
  const e = inp.selectionEnd == null ? inp.value.length : inp.selectionEnd;
  inp.value = inp.value.slice(0, s) + c + inp.value.slice(e);
  inp.focus(); try { inp.setSelectionRange(s + 1, s + 1); } catch (err) {}
}
async function act(a, d) {
  switch (a) {
    case "go": go(d.to); break;
    case "back": if (history.length > 1) history.back(); else go("learn"); break;
    case "start": startBatch(+d.b); break;
    case "review": startReview(); break;
    case "speak": speak(d.say); break;
    case "flip": flip(); break;
    case "nextcard": S.deal++; S.flipped = false; render(); autoSpeakCard(); break;
    case "quiz": beginQuiz(); break;
    case "pick": submit(+d.i); break;
    case "uml": insertChar(d.c); break;
    case "next": nextQ(); break;
    case "boss-start": S.boss.state = "play"; render(); break;
    case "pickt": { const B = S.boss; if ((B.state === "play" || B.state === "miss") && !B.picked.includes(+d.pi)) { B.picked.push(+d.pi); render(); } break; }
    case "unpick": { const B = S.boss; if (B.state === "play" || B.state === "miss") { B.picked.splice(+d.pos, 1); render(); } break; }
    case "clear": S.boss.picked = []; render(); break;
    case "attack": bossCheck(); break;
    case "boss-next": S.boss.r++; setupRound(); render(); break;
    case "boss-won": finish(); break;
    case "rematch": resetBoss(); render(); break;
    case "quit": quit(); break;
    case "home": goHome(); break;
    case "auth-mode": ui.authMode = d.m; ui.authError = ""; render(); break;
    case "logout": { const n = user ? user.name : ""; await SVC.auth.logOut(); switchUser(null, false); ui.confirmCancel = false; toast("Logged out. Tschüss" + (n ? ", " + n : "") + "!"); go("learn"); break; }
    case "name-edit": ui.editName = true; ui.nameError = ""; render(); break;
    case "name-cancel": ui.editName = false; ui.nameError = ""; render(); break;
    case "pref": PR[d.k] = d.k === "goal" ? +d.v : d.v; savePrefs(); if (d.k === "theme") { applyTheme.touched = true; applyTheme(); } render(); break;
    case "reset": ui.confirmReset = true; render(); break;
    case "reset-no": ui.confirmReset = false; render(); break;
    case "reset-yes": P = fresh(); ui.confirmReset = false; save(); render(); toast("Progress erased."); break;
    case "plan": ui.plan = d.id; render(); break;
    case "checkout": checkout(); break;
    case "pay": pay(); break;
    case "modal-close": ui.modal = null; render(); break;
    case "modal-done": ui.modal = null; go("learn"); break;
    case "cancel-ask": ui.confirmCancel = true; render(); break;
    case "cancel-no": ui.confirmCancel = false; render(); break;
    case "cancel-yes": user = await SVC.billing.cancel(); ui.confirmCancel = false; toast("Subscription cancelled. Premium stays on until the end of your period."); render(); break;
    case "resume": user = await SVC.billing.resume(); toast("Your subscription continues."); render(); break;
  }
}
const app = document.getElementById("app");
app.addEventListener("click", e => {
  if (ui.modal && e.target.hasAttribute && e.target.hasAttribute("data-modal-back")) { if (ui.modal.state === "confirm") { ui.modal = null; render(); } return; }
  const t = e.target.closest("[data-act]");
  if (!t || t.disabled || !app.contains(t)) return;

app.addEventListener("submit", e => {

  else if (id === "nameform") onRename(e.target);
});

  else if (id === "opt-typing") PR.typing = e.target.checked;

  else return;
  savePrefs();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && ui.modal && ui.modal.state === "confirm") { ui.modal = null; render(); return; }
  if (route() !== "play" || !S || e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "textarea") return;
  if (S.phase === "deal") {
    const onCard = e.target.closest && e.target.closest(".flip");
    if ((e.key === " " || e.key === "Enter") && onCard) { e.preventDefault(); flip(); }
    else if (e.key === "f" || e.key === "ArrowUp" || e.key === "ArrowDown") { e.preventDefault(); flip(); }
    else if (e.key === "ArrowRight" && tag !== "button") { const ids = S.sets[S.set]; if (S.deal < ids.length - 1) act("nextcard", {}); else beginQuiz(); }
  } else if (S.phase === "quiz") {
    const q = S.queue[S.qi];
    if (S.fb && (S.fb.kind === "good" || S.fb.kind === "reveal")) { if (e.key === "Enter" && tag !== "button") { e.preventDefault(); nextQ(); } return; }
    if (q && q.options && /^[1-4]$/.test(e.key)) { const i = +e.key - 1; if (i < q.options.length && !q.disabled.includes(i)) submit(i); }
  }
});

/* ---------- boot ---------- */
applyTheme();
if (route() === "play") { try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {} }
render();
initRemote();
})();
</script>
